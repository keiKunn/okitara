      <circle cx="6" cy="6" r="3.4" fill="#1E2340" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FFD23F"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <rect x="44" y="44" width="1112" height="542" rx="42" fill="none" stroke="#1E2340" stroke-width="7"/>

  <rect x="96" y="112" width="374" height="54" rx="27" fill="#1E2340"/>
  <text x="283" y="149" text-anchor="middle"
        font-family="Hiragino Maru Gothic ProN, Hiragino Sans, sans-serif"
        font-size="27" font-weight="700" fill="#FFD23F">寝過ごし先シミュレーター</text>

  <g font-family="Hiragino Maru Gothic ProN, Hiragino Sans, sans-serif"
