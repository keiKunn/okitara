    <text x="96" y="318" fill="none" stroke="#1E2340" stroke-width="14" stroke-linejoin="round">起きたら、○○。</text>
    <text x="96" y="318" fill="#1E2340">起きたら、<tspan fill="#FF4E88">○○</tspan>。</text>
  </g>

  <text x="96" y="392" font-family="Hiragino Maru Gothic ProN, Hiragino Sans, sans-serif"
