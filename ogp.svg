  <rect x="96" y="446" width="796" height="82" rx="41" fill="#FFFFFF" stroke="#1E2340" stroke-width="5"/>
  <text x="494" y="498" text-anchor="middle"
        font-family="Hiragino Maru Gothic ProN, Hiragino Sans, sans-serif"
        font-size="30" font-weight="700" fill="#1E2340">首都圏34路線　終着駅・県名市名・タクシー代まで</text>

  <circle cx="1010" cy="487" r="41" fill="#FF4E88" stroke="#1E2340" stroke-width="5"/>
  <circle cx="1088" cy="487" r="41" fill="#2EC4F3" stroke="#1E2340" stroke-width="5"/>
